
name: Build SkipAdsAlwaysActive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Folder app tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set Java and Kotlin target to 17
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if grep -q 'sourceCompatibility' "$BUILD_FILE"; then
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$BUILD_FILE"
          fi

          if ! grep -q 'targetCompatibility = JavaVersion.VERSION_17' "$BUILD_FILE"; then
            sed -i '/android {/a\
                compileOptions {\
                    sourceCompatibility = JavaVersion.VERSION_17\
                    targetCompatibility = JavaVersion.VERSION_17\
                }' "$BUILD_FILE"
          fi

          if ! grep -q 'jvmTarget = "17"' "$BUILD_FILE"; then
            sed -i '/android {/a\
                kotlinOptions {\
                    jvmTarget = "17"\
                }' "$BUILD_FILE"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipAdsAlwaysActive-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
