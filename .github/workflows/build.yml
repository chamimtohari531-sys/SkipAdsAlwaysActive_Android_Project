name: Build SkipAdsAlwaysActive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."
          PROJECT_DIR=""

          # Check project files already in repository
          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "Project found in repository: $PROJECT_DIR"
          fi

          # If not found, search ZIP files
          if [ -z "$PROJECT_DIR" ]; then
            for ZIP in $(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname "*.zip"); do

              echo "Checking ZIP: $ZIP"
              TEMP_DIR="/tmp/project_check"
              rm -rf "$TEMP_DIR"
              mkdir -p "$TEMP_DIR"

              unzip -q "$ZIP" -d "$TEMP_DIR" || continue

              SETTINGS=$(find "$TEMP_DIR" \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                | head -n 1 || true)

              if [ -n "$SETTINGS" ]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
                echo "Android project found inside: $ZIP"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo "Files available:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Check Android project
        run: |
          echo "Checking project files..."
          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -d "$PROJECT_DIR/app" || {
            echo "ERROR: Folder app not found"
            find "$PROJECT_DIR" -maxdepth 3 -type d
            exit 1
          }

          echo "Project check successful!"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipAdsAlwaysActive-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
